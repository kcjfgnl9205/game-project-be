services:
  db:
    image: mysql:8.0
    container_name: game-project-db
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: game_project
      MYSQL_USER: nest
      MYSQL_PASSWORD: nestpassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-prootpassword",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile.develop
    container_name: game-project-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://nest:nestpassword@db:3306/game_project
      PORT: 3000
      CORS_ORIGINS: http://localhost:5173,http://localhost:3001,http://localhost:5174,https://local.nolmoa.com:5173,https://local.nolmoa.com:5174
      JWT_ACCESS_SECRET: dev-access-secret
      JWT_REFRESH_SECRET: dev-refresh-secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      # macOS 도커 bind mount는 inotify 이벤트가 전파되지 않아 nest --watch가
      # 파일 변경을 못 잡는다. polling으로 강제해 코드 변경이 자동 반영되게 한다.
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./:/usr/src/app
      - /usr/src/app/node_modules
      # dist를 호스트와 분리(익명 볼륨)해 watch 재시작 시 ENOTEMPTY(rmdir dist) 방지
      - /usr/src/app/dist
    command: >
      sh -c "npm install &&
             npx prisma generate &&
             npx prisma db push --accept-data-loss &&
             npm run start:dev"

volumes:
  db_data:
