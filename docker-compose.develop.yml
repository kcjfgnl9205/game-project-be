services:
  db:
    image: mysql:8.0
    container_name: game-project-db
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: game_project
      MYSQL_USER: nest
      MYSQL_PASSWORD: nestpassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile.develop
    container_name: game-project-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://nest:nestpassword@db:3306/game_project
      PORT: 3000
      CORS_ORIGINS: http://localhost:5173,http://localhost:3001,http://localhost:5174
      JWT_ACCESS_SECRET: dev-access-secret
      JWT_REFRESH_SECRET: dev-refresh-secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: admin1234
      ADMIN_NICKNAME: admin
    ports:
      - "3000:3000"
    volumes:
      - ./:/usr/src/app
    command: >
      sh -c "npm install &&
             npx prisma generate &&
             npx prisma db push --accept-data-loss &&
             npm run seed &&
             npm run start:dev"

volumes:
  db_data:
