# /etc/nginx/sites-available/api 로 복사 후 sites-enabled에 심볼릭 링크
# 도메인 부분은 본인 도메인으로 변경

# WebSocket 업그레이드용 Connection 헤더 매핑.
# - Upgrade 요청(websocket)이면 Connection: upgrade
# - 일반 요청이면 Connection: close (keepalive와 충돌 방지)
# sites-enabled/*.conf 는 http{} 안에서 include 되므로 여기 두면 적용된다.
# (Connection 을 "upgrade" 로 하드코딩하면 일반 HTTP까지 영향을 받으므로 map 사용)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ===== 운영 API (api.nolmoa.com) → prod-app:3000 =====
server {
    listen 80;
    listen [::]:80;
    server_name api.nolmoa.com;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # --- WebSocket(socket.io) 업그레이드 ---
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # 그림 같은 장기 연결이 끊기지 않도록 충분히 길게
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

# ===== 개발 API (dev-api.nolmoa.com) → dev-app:3001 =====
server {
    listen 80;
    listen [::]:80;
    server_name dev-api.nolmoa.com;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # --- WebSocket(socket.io) 업그레이드 ---
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # 그림 같은 장기 연결이 끊기지 않도록 충분히 길게
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
